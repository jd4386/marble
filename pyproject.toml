[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marble"
version = "0.1.0"
description = "MARBLE: Multi-scale linear-time encoder for whole-slide image analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MARBLE authors" }]
dependencies = [
    "torch==2.4.0",
    "mamba-ssm==2.2.4",
    "h5py==3.13.0",
    "pandas==2.2.3",
    "numpy==2.2.5",
    "scikit-learn==1.6.1",
    "scikit-survival==0.24.1",
    "tqdm==4.67.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
marble-train = "marble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
