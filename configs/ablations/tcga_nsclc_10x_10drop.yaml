# Ablation: TCGA-NSCLC single-scale 10× with 10% drop.
dataset: TCGA_NSCLC
levels_sub_dirs: [level_1_10x]
scale_factors: [1]
patch_size: 256
batch_size: 1
epochs: 100
removal_fraction: 0.1
embedding_dim: 1024
base_lr: 3.0e-5
weight_decay: 0.01
warmup_epochs: 5
patience: 10
use_amp: false
model_save_path: checkpoints/ablations/weights/MARBLE_TCGA_NSCLC_10x_10drop.pth
# Override: labels_csv, multi_scale_features_dir, splits_path
